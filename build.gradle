// Top-level build file where you can configure options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'
    }
}

plugins {
    id 'maven-publish'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://google.github.io/webrtc-android/maven" }
        maven { url = uri("https://raw.githubusercontent.com/alexgreench/google-webrtc/master") }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            jitpack(MavenPublication) {
                groupId = project.findProperty('group') ?: 'com.github.0xli'
                artifactId = project.findProperty('artifact') ?: 'Elastos.NET.WebRTC.Android.SDK'
                version = project.findProperty('version') ?: '0.0.4-SNAPSHOT'
                def aar = file("${rootDir}/webrtc/build/outputs/aar/webrtc-release.aar")
                artifact(aar) {
                    builtBy tasks.getByPath(':webrtc:assembleRelease')
                }
                pom {
                    name = 'Elastos WebRTC Android SDK'
                    description = 'Elastos Carrier WebRTC SDK'
                    url = 'https://github.com/0xli/Elastos.NET.WebRTC.Android.SDK'
                    packaging = 'aar'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')
                        [
                                ['org.webrtc', 'google-webrtc', '1.0.30039'],
                                ['org.awaitility', 'awaitility', '3.0.0'],
                                ['com.google.guava', 'guava', '28.1-android'],
                                ['org.apache.commons', 'commons-lang3', '3.9'],
                                ['com.google.code.gson', 'gson', '2.8.6'],
                                ['org.slf4j', 'slf4j-api', '1.7.29'],
                                ['com.github.tony19', 'logback-android', '2.0.0'],
                                ['commons-codec', 'commons-codec', '1.10'],
                                ['org.osgi', 'org.osgi.framework', '1.9.0'],
                                ['androidx.annotation', 'annotation', '1.0.0']
                        ].each { dep ->
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', dep[0])
                            dependencyNode.appendNode('artifactId', dep[1])
                            dependencyNode.appendNode('version', dep[2])
                            dependencyNode.appendNode('scope', 'compile')
                        }
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

/**
 * Copies release AAR + minimal POM into ../beaglechat/local-maven for {@code implementation 'org.elastos.carrier:webrtc:0.0.4'}.
 */
tasks.register('publishToBeagleLocal') {
    group = 'publishing'
    description = 'Install webrtc-release.aar as org.elastos.carrier:webrtc:0.0.4 into ../beaglechat/local-maven'
    dependsOn ':webrtc:assembleRelease'
    doLast {
        def outDir = file("${rootDir}/../beaglechat/local-maven/org/elastos/carrier/webrtc/0.0.4")
        outDir.mkdirs()
        def aarIn = file("${rootDir}/webrtc/build/outputs/aar/webrtc-release.aar")
        if (!aarIn.exists()) {
            throw new GradleException("Missing ${aarIn} — run :webrtc:assembleRelease first")
        }
        copy {
            from aarIn
            into outDir
            rename { 'webrtc-0.0.4.aar' }
        }
        def pom = new File(outDir, 'webrtc-0.0.4.pom')
        pom.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <modelVersion>4.0.0</modelVersion>
  <groupId>org.elastos.carrier</groupId>
  <artifactId>webrtc</artifactId>
  <version>0.0.4</version>
  <packaging>aar</packaging>
  <dependencies>
    <dependency><groupId>org.webrtc</groupId><artifactId>google-webrtc</artifactId><version>1.0.30039</version><scope>compile</scope></dependency>
    <dependency><groupId>org.awaitility</groupId><artifactId>awaitility</artifactId><version>3.0.0</version><scope>compile</scope></dependency>
    <dependency><groupId>com.google.guava</groupId><artifactId>guava</artifactId><version>28.1-android</version><scope>compile</scope></dependency>
    <dependency><groupId>org.apache.commons</groupId><artifactId>commons-lang3</artifactId><version>3.9</version><scope>compile</scope></dependency>
    <dependency><groupId>com.google.code.gson</groupId><artifactId>gson</artifactId><version>2.8.6</version><scope>compile</scope></dependency>
    <dependency><groupId>org.slf4j</groupId><artifactId>slf4j-api</artifactId><version>1.7.29</version><scope>compile</scope></dependency>
    <dependency><groupId>com.github.tony19</groupId><artifactId>logback-android</artifactId><version>2.0.0</version><scope>compile</scope></dependency>
    <dependency><groupId>commons-codec</groupId><artifactId>commons-codec</artifactId><version>1.10</version><scope>compile</scope></dependency>
    <dependency><groupId>org.osgi</groupId><artifactId>org.osgi.framework</artifactId><version>1.9.0</version><scope>compile</scope></dependency>
    <dependency><groupId>androidx.annotation</groupId><artifactId>annotation</artifactId><version>1.0.0</version><scope>compile</scope></dependency>
  </dependencies>
</project>
"""
        println "Published to ${pom.parentFile.absolutePath}"
    }
}
